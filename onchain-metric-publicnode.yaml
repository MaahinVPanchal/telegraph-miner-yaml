version: "1"
kind: miner
id: 9602
slug: onchain-metric-publicnode
protocol: generic
name: OnChain Metric Verify (Hybrid archive + Ethplorer)
description: Reads Ethereum mainnet state at a specified block height and returns one small JSON answer (under 4 KB). ETH balance, transaction count (nonce), contract-code presence and ERC-20 token balance are read via archive JSON-RPC at that exact historical block. Answers "at block 18000000, what was the ETH balance of 0x...", "how many transactions had 0x... sent by block N", "did 0x... have contract code at block N", "what was the USDC balance of 0x... at block N".
base_url: https://onchain-hybrid.panchalmaahin.workers.dev

docs:
  website: https://github.com/MaahinVPanchal/telegraph-miner-yaml
  documentation: https://github.com/MaahinVPanchal/telegraph-miner-yaml

endpoints:
  - path: /query
    external_path: /query
    method: GET
    description: >
      One on-chain value for intent ONCHAIN_METRIC_VERIFY_GENERAL, read at the specific block
      stated in the question. Send address, block_number and optionally metric and token.
      The response is compact JSON with ok, metric, address, block (the requested integer block),
      block_tag (number), value, unit and source; for eth_balance it also has balance_wei
      (exact integer string) and balance_eth (exact decimal string, ETH units). Use value together
      with unit as the answer; Telegraph can compare unit aliases such as ETH and Gwei. For
      eth_balance, balance_wei is available when an exact wei value is needed. The value is read
      at the requested block, never substituted with latest state. A response with ok false and
      an error code means the question could not be answered; it never contains a guessed value.
    intents: [ONCHAIN_METRIC_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: "Ethereum mainnet address, 0x followed by exactly 40 hex characters (42 characters total), e.g. 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045. Not an ENS name. For erc20_balance this is the holder, not the token."
          - name: block_number
            type: string
            intents: ["*"]
            description: "Required block height the question is anchored at: a decimal integer such as 18000000 or a 0x-prefixed hex integer such as 0x112a880. Do not send latest; this intent requires a specific block. The response block field is the integer block that was read."
        optional:
          - name: metric
            type: string
            intents: ["*"]
            description: "Which value to read. Send exactly one of: eth_balance (native ETH balance, the default), tx_count (number of transactions sent, i.e. the nonce), code (whether the address had contract code; value true or false), erc20_balance (balance of the ERC-20 token named in token). Nothing else is valid."
          - name: token
            type: string
            intents: ["*"]
            description: "Only for metric erc20_balance: the ERC-20 token contract address, 0x followed by exactly 40 hex characters, e.g. USDC 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48."

semantics:
  signal_mapping:
    label_field: value
  supported_intents:
    - ONCHAIN_METRIC_VERIFY_GENERAL

input_schema:
  type: object
  required: [address, block_number]
  properties:
    address:
      type: string
      description: Ethereum mainnet address, 0x-prefixed 40 hex characters.
      pattern: "^0x[0-9a-fA-F]{40}$"
      default: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
    block_number:
      type: string
      description: Required specific block height as a decimal integer string (e.g. 18000000) or a 0x-prefixed hex string (e.g. 0x112a880). The latest alias is not accepted for this intent.
      pattern: "^(0x[0-9a-fA-F]+|[0-9]+)$"
    metric:
      type: string
      enum: [eth_balance, tx_count, code, erc20_balance]
      default: eth_balance
    token:
      type: string
      description: ERC-20 contract address for erc20_balance.
      pattern: "^0x[0-9a-fA-F]{40}$"

output_schema:
  type: object
  properties:
    ok:
      type: boolean
    metric:
      type: string
    address:
      type: string
    block:
      type: integer
      description: Integer block number the value was read at; matches the specified block height.
    block_tag:
      type: string
      enum: [number]
      description: The response is always for the specifically requested numbered block.
    value:
      description: The answer in the adjacent unit field. For eth_balance this is a decimal ETH string; unit-aware evaluation can compare equivalent units such as ETH and Gwei. It is a decimal string for tx_count and erc20_balance, and a boolean for code.
    unit:
      type: string
    balance_wei:
      type: string
      description: eth_balance only. Exact integer wei.
    balance_eth:
      type: string
      description: eth_balance only. Exact decimal ETH.
    token:
      type: string
      description: erc20_balance only. Lower-cased token contract.
    raw_balance:
      type: string
      description: erc20_balance only. Integer balance in the token's smallest unit.
    decimals:
      type: integer
      description: erc20_balance only. Token decimals.
    code_size_bytes:
      type: integer
      description: code only. Deployed bytecode size at that block.
    source:
      type: string
      description: Host the value was read from.
    block_note:
      type: string
      description: Present only when the Ethplorer fallback was used.
    as_of:
      type: string
      description: ISO-8601 time the value was read.
    error:
      type: string
      description: Error code, present only when ok is false.
    message:
      type: string
      description: Error detail, present only when ok is false.

cache_ttl_sec: 2
rate_limit_per_sec: 5
circuit_threshold: 5
circuit_cooldown_seconds: 30
