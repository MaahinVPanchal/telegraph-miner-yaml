version: "1"
kind: miner
id: 9602
slug: onchain-metric-publicnode
protocol: generic
name: OnChain Metric Verify (Blockscout Ethereum)
description: Reads canonical on-chain state directly from the Blockscout Ethereum API - balances, token holdings, transaction counts, contract code - returned as decimal values. Answers "what is the ETH balance of address X" and "what does this address hold" with values read straight from chain.
base_url: https://eth.blockscout.com

docs:
  website: https://blockscout.com
  documentation: https://eth.blockscout.com/docs

endpoints:
  - path: /query
    external_path: /api/v2/addresses/{address}
    method: GET
    description: >
      On-chain address metrics for intent ONCHAIN_METRIC_VERIFY. The response contains
      coin_balance - the address's ETH balance in DECIMAL wei (not hex) - plus
      exchange_rate, token counts and transaction counts. The answer value for
      ONCHAIN_METRIC_VERIFY is the number at coin_balance. Convert wei to ETH (divide
      by 1e18) only when the question asks for ETH units; otherwise report the wei value.
    intents: [ONCHAIN_METRIC_VERIFY]
    params:
      path:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: "EVM address to query, 0x-prefixed 40 hex characters, e.g. 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045."

semantics:
  signal_mapping:
    label_field: coin_balance
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

input_schema:
  type: object
  required: [address]
  properties:
    address:
      type: string
      description: EVM address, 0x-prefixed 40 hex characters.
      default: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"

on_chain:
  description: Stores signal for ONCHAIN_METRIC_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

cache_ttl_sec: 2
rate_limit_per_sec: 10
